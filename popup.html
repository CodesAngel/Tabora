<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabora</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup-body">
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand"><img class="popup-brand-icon" src="icons/tabora-32.png" width="28" height="28" alt=""><span>Tabora</span></div>
        <button id="openDashboard" class="square-button" title="Open dashboard" aria-label="Open dashboard"><svg class="popup-header-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"></rect><rect x="15" y="3" width="6" height="6" rx="1"></rect><rect x="3" y="15" width="6" height="6" rx="1"></rect><rect x="15" y="15" width="6" height="6" rx="1"></rect></svg></button>
      </header>

      <section class="current-tab-panel" aria-labelledby="currentTabTitle">
        <div class="current-tab-row">
          <span id="currentTabIcon" class="current-tab-icon"></span>
          <div class="current-tab-copy"><strong id="currentTabTitle">This tab</strong><small id="currentTabDomain"></small></div>
        </div>
        <div id="saveTabControls" class="split-button">
          <button id="saveTab" class="accent-button split-main" type="button">Save tab</button>
          <button id="chooseBoard" class="accent-button split-toggle" type="button" aria-label="Choose a board" aria-haspopup="menu" aria-expanded="false" aria-controls="boardMenu"><svg class="popup-button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg></button>
        </div>
        <div id="boardMenu" class="board-menu" role="menu" aria-label="Save to board" hidden></div>
        <form id="newBoardForm" class="new-board-form" hidden>
          <input id="newBoardName" class="text-input" placeholder="New board name" maxlength="60" aria-label="New board name" required>
          <button class="accent-button" type="submit">Create and save</button>
        </form>
        <div id="duplicateNotice" class="duplicate-notice" hidden>
          <div><strong id="duplicateTitle"></strong><small id="duplicateDetail"></small></div>
          <button id="showDuplicate" class="secondary-button" type="button">Show it</button>
        </div>
        <p id="unsavableNotice" class="popup-hint" hidden>Tabora can only save web pages (http and https).</p>
      </section>

      <details id="windowSave" class="window-save">
        <summary><svg class="popup-button-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 8h18M12 11v5M9.5 13.5 12 16l2.5-2.5"></path></svg><span id="windowSaveLabel">Save whole window as a board</span></summary>
        <div class="window-save-body">
          <label class="field-label" for="captureName">Board name</label>
          <input id="captureName" class="text-input" placeholder="Research session" maxlength="60">
          <div class="quick-row">
            <select id="capturePage" class="select-input" aria-label="Destination page"></select>
            <button id="saveWindow" class="accent-button" type="button">Save window</button>
          </div>
        </div>
      </details>

      <label class="popup-search">
        <svg class="popup-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7.5"></circle><path d="m16.5 16.5 4 4"></path></svg>
        <input id="popupSearch" type="search" placeholder="Search boards and links" autocomplete="off">
      </label>
      <div id="popupStatus" class="popup-status" role="status" aria-live="polite" hidden></div>

      <section class="section-block">
        <div class="section-title">Recently used</div>
        <div id="recentBoards" class="popup-board-list"></div>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
